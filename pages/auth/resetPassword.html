<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="/components/logo.png">
    <link rel="stylesheet" href="../../styles/auth/forgotPass.css">
    <title>Reset Password | Southpoint</title>
</head>

<body>
    <div class="login-wrapper">

        <!-- LEFT PANEL -->
        <div class="login-left">
            <div class="left-content">
                <div class="brand-logo">
                    <div class="brand-text">
                        <span class="brand-name">Southpoint</span>
                        <span class="brand-sub">Premiere Badminton Court</span>
                    </div>
                </div>

                <div class="left-divider"></div>

                <div class="feature-list">
                    <div class="feature-item">
                        <i class='bx bx-calendar-check'></i>
                        <span>Online court reservations</span>
                    </div>
                    <div class="feature-item">
                        <i class='bx bx-time-five'></i>
                        <span>Real-time court availability</span>
                    </div>
                    <div class="feature-item">
                        <i class='bx bx-user-check'></i>
                        <span>Coach booking & scheduling</span>
                    </div>
                </div>

                <p class="left-footer">© 2026 Premiere Southpoint Badminton Court</p>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="login-right">
            <div class="login-card">
                <h1 class="login-title">Reset Password</h1>
                <p class="login-sub">Enter your new password below to regain access to your account.</p>

                <form id="resetForm">
                    <div class="input-group password-group">
                        <input type="password" id="newPassword" placeholder="New Password" required>
                        <i class='bx bx-low-vision' id="toggleNewPassword"></i>
                    </div>

                    <div class="input-group password-group">
                        <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
                        <i class='bx bx-low-vision' id="toggleConfirmPassword"></i>
                    </div>

                    <button type="submit" class="btn-login" id="updateBtn">UPDATE PASSWORD</button>
                </form>

                <div class="message-box" id="messageBox"></div>

                <div class="back-link">
                    <a href="login.html">← Back to Login</a>
                </div>

                <div class="login-footer">
                    <p>Need help? <a href="#">Contact Admin</a></p>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="../../scripts/auth/resetPassword.js"></script>
    <script>
        document.getElementById('toggleNewPassword').addEventListener('click', function () {
            const input = document.getElementById('newPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
            this.classList.toggle('bx-show');
            this.classList.toggle('bx-low-vision');
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function () {
            const input = document.getElementById('confirmPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
            this.classList.toggle('bx-show');
            this.classList.toggle('bx-low-vision');
        });
    </script>
</body>

</html>
